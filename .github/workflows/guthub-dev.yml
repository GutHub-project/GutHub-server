name: guthub-dev.yml
on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x .gradlew

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: guthub-server-jar
          path: GutHub-project/GutHub-server/build/libs/*.jar


  docker-push:

    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: guthub-server-jar
          path: GutHub-project/GutHub-server/build/libs/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./GutHub-project/GutHub-server
          push: true
          tags: moset1/guthub-server:${{ github.sha }}


  deploy:

    needs: docker-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PEM_KEY }}
          port: 22

          script: |
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker pull moset1/guthub-server:${{ github.sha }}

            docker stop guthub-server || true
            docker rm guthub-server || true

            docker run -d --name guthub-server -p 8080:8080 \
            -e "SPRING_PROFILES_ACTIVE=dev" \
            -e "SERVER_DOMAIN=${{ secrets.SERVER_DOMAIN }}" \
            -e "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
            -e "FRONTEND_DOMAIN=${{ secrets.FRONTEND_DOMAIN }}" \
            \
            -e "SPRING_DATASOURCE_URL=jdbc:mysql://${{ secrets.RDS_ENDPOINT }}:3306/users?serverTimezone=Asia/Seoul&characterEncoding=UTF-8" \
            -e "SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}" \
            -e "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            \
            -e "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -e "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            \
            -e "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" \
            -e "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" \
            
            \
            moset1/guthub-server:${{ github.sha }}

            # 5. 불필요한 이미지 정리
            docker image prune -f