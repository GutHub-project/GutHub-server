spring:
  config:
    activate:
      on-profile: "dev"

  # 개발 서버 DB 설정 (실제 값으로 수정 필요)
  datasource:
    url: ${SPRING_DATASOURCE_URL} # 예: jdbc:mysql://dev-db.example.com:3306/guthub_dev
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 개발 서버에서는 update 또는 validate 사용 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # 데이터 초기화 스크립트가 ddl-auto 이후에 실행되도록 보장
    defer-datasource-initialization: true

  # data-dev.sql 스크립트를 사용하도록 설정
  sql:
    init:
      mode: always # 항상 스크립트 실행


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://${SERVER_DOMAIN}/login/oauth2/code/google"
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://${SERVER_DOMAIN}/login/oauth2/code/naver"
            scope:
              - name
              - email
            client-name: Naver

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "http://${SERVER_DOMAIN}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 프론트엔드 URL 설정
frontend:
  url: "http://${FRONTEND_DOMAIN}"


jwt:
  secret:
    key: ${JWT_SECRET_KEY}

backend:
  url: "http://${SERVER_DOMAIN}"